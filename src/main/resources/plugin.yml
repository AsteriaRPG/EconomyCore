name: EconomyCore
version: 0.3.1
main: jp.asteria.economy.EconomyCore
description: 経済プラグイン
author: deceitya
website: https://github.com/XxPMMPERxX/EconomyCore
api: 3.0.0
load: POSTWORLD
depend:
  - DBConnectorN
  - PlayersID
permissions:
  jp.asteria.economy.commands.money:
    description: for /money
    default: true
  jp.asteria.economy.commands.pay:
    description: for /money pay
    default: true
  jp.asteria.economy.commands.help:
    description: for /money help
    default: true
  jp.asteria.economy.commands.give:
    description: for /money give
    default: op
  jp.asteria.economy.commands.take:
    description: for /money take
    default: op
  jp.asteria.economy.commands.show:
    description: for /money show
    default: op
